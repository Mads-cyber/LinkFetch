workflows:
  android-workflow:
    name: Android Debug Build
    environment:
      groups:
        - android_signing # Only add if you need APK signing (see Step 3)
    scripts:
      - name: Build Debug APK
        script: | 
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - mudasarash@gmail.com # Replace with your email
